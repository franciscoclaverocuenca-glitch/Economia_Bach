# Claves propuestas para los cuestionarios que estaban en Google Forms.
# Google no publica la respuesta correcta, así que estas claves y explicaciones
# están redactadas a partir del contenido de cada sesión. Revísalas.
# Formato: unidad-sesión: lista en el mismo orden que las preguntas → [V|F, explicación]
sda01-s07:
  - [F, "**Falso.** Significa que decidimos con información, tiempo y capacidad de cálculo limitados, y recurrimos a atajos. No es irracionalidad: es racionalidad con límites."]
  - [V, "**Verdadero.** Perder duele más que ganar lo mismo: bajar el precio se vive como una pérdida, y se prefiere esperar aunque el piso vacío también cueste."]
  - [F, "**Falso.** Un *nudge* no prohíbe nada: cambia cómo se presentan las opciones para orientar la decisión, manteniendo la libertad de elegir."]
  - [V, "**Verdadero.** El primer número que aparece actúa como ancla: las ofertas y contraofertas se hacen en torno a él."]
  - [F, "**Falso.** Son errores **sistemáticos y predecibles**: se repiten en la misma dirección. Por eso se pueden estudiar… y aprovechar."]
sda02-s02:
  - [F, "**Falso.** En una cooperativa las personas socias son a la vez propietarias y deciden democráticamente: una persona, un voto, no un voto por cada acción."]
  - [F, "**Falso.** Es propiedad de sus socios y socias, no del Estado. Por eso es una cuarta forma: ni empresa capitalista al uso ni propiedad pública."]
  - [V, "**Verdadero.** El cooperativismo agrario (aceite, frutas, hortalizas) tiene una larga tradición en Andalucía."]
  - [F, "**Falso.** Lo que importa es **cómo se toman las decisiones**: quién decide, con qué reglas y cómo se reparte lo que se gana."]
sda02-s03:
  - [V, "**Verdadero.** Describe un hecho que se puede comprobar con datos: es un enunciado positivo."]
  - [F, "**Falso.** «Injusto» es un juicio de valor: es un enunciado normativo."]
  - [F, "**Falso.** Un enunciado normativo expresa una valoración u opinión; no se puede comprobar con datos si es verdadero o falso."]
  - [F, "**Falso.** Un modelo simplifica a propósito: se queda con lo esencial para poder explicar y predecir."]
  - [V, "**Verdadero.** *Ceteris paribus*: «lo demás constante». Permite estudiar el efecto de una sola variable."]
  - [F, "**Falso.** Es muy frecuente que un titular mezcle un dato (positivo) con una valoración (normativo). Saber separarlos es la habilidad que se entrena."]
sda02-s08:
  - [F, "**Falso.** En la economía de mercado los precios surgen de la interacción entre oferta y demanda, no los fija una autoridad central."]
  - [V, "**Verdadero.** Obtiene el bien quien puede y quiere pagar su precio. Es eficiente, pero plantea problemas de equidad."]
  - [V, "**Verdadero.** Si algo escasea, su precio sube y todos lo perciben sin que nadie tenga que calcular la escasez."]
  - [F, "**Falso.** Los fallos de mercado (externalidades, bienes públicos, información asimétrica…) son precisamente uno de sus límites documentados."]
  - [F, "**Falso.** Es **la misma ficha**: mañana se rellena para la planificación central y en la sesión 10 se comparan las dos. Comparar exige medir con la misma regla."]
sda02-s09:
  - [F, "**Falso.** En la planificación central los precios los fija la autoridad planificadora, no el mercado."]
  - [V, "**Verdadero.** El pleno empleo figuraba entre sus objetivos declarados."]
  - [F, "**Falso.** Hay que distinguir entre lo que un sistema se propone y lo que los datos muestran que consiguió."]
  - [F, "**Falso.** Esa es justamente la ventaja del mercado: nadie necesita saberlo todo, porque los precios transmiten la información."]
  - [F, "**Falso.** El objetivo no es decidir cuál es mejor, sino analizar los dos con el mismo rigor para poder compararlos en la sesión 10."]
sda03-s01:
  - [F, "**Falso.** Málaga tiene también un sector tecnológico y de servicios avanzados muy relevante (Málaga TechPark), además del turismo y la agricultura."]
  - [V, "**Verdadero.** Esa es la idea central: producción, comercio y finanzas cada vez más conectados entre países."]
  - [F, "**Falso.** Un arancel es un **impuesto** sobre los productos importados. Encarece lo que viene de fuera."]
  - [F, "**Falso.** El diagnóstico no se califica: se guarda y se vuelve a responder en la sesión 13 para medir lo aprendido."]
  - [F, "**Falso.** Los cuatro roles son **fijos**: no rotan durante toda la unidad. Por eso conviene repartirlos bien desde el principio."]
sda03-s06:
  - [V, "**Verdadero.** Es un servicio (turismo) que un residente extranjero paga a España: es una exportación de servicios."]
  - [F, "**Falso.** Es una inversión extranjera: se registra en la **balanza financiera**, no en la cuenta corriente."]
  - [V, "**Verdadero.** Se anotan como transferencias que España recibe del exterior."]
  - [F, "**Falso.** Si el euro se aprecia, el comprador estadounidense necesita más dólares por cada euro: el aceite se le **encarece**."]
  - [F, "**Falso.** Una moneda fuerte encarece las exportaciones y perjudica a quien vende fuera. Beneficia, en cambio, a quien importa."]
  - [V, "**Verdadero.** Superávit comercial: exportaciones de bienes mayores que importaciones de bienes."]
sda03-s07:
  - [F, "**Falso.** Sus componentes se diseñan, fabrican y ensamblan en muchos países: es una cadena global de valor."]
  - [F, "**Falso.** El valor añadido se concentra en el diseño, la tecnología y la marca, y es menor en el ensamblaje."]
  - [F, "**Falso.** Detrás hubo decisiones políticas: acuerdos comerciales, rebajas arancelarias, organismos internacionales."]
  - [V, "**Verdadero.** Los datos muestran un fuerte descenso de la pobreza extrema global en las últimas décadas, aunque de forma muy desigual."]
  - [F, "**Falso.** Que siga siendo una prioridad indica que el problema persiste, no que no se haya reducido. Son dos afirmaciones distintas."]
sda03-s08:
  - [F, "**Falso.** Eso es la economía **lineal**. La circular busca reducir, reutilizar y reciclar para cerrar el ciclo."]
  - [V, "**Verdadero.** Cuantos más usuarios tiene una red (una plataforma, una app), más valor tiene para cada uno."]
  - [F, "**Falso.** Significa lo contrario: hay empleo disponible, pero falta personal con la cualificación que se busca."]
  - [F, "**Falso.** En zonas turísticas puede presionar al alza los alquileres y reducir la vivienda residencial disponible."]
  - [F, "**Falso.** Un caso concreto no desmiente un dato agregado: la media del sector puede seguir siendo la misma."]
  - [V, "**Verdadero.** Su producción se concentra en muy pocos lugares, y cualquier problema allí frena toda la cadena."]
sda03-s10:
  - [F, "**Falso.** El crecimiento puede ir acompañado de un aumento de la desigualdad; el reparto no es automático."]
  - [V, "**Verdadero.** El crecimiento verde confía en que la tecnología permita crecer reduciendo el impacto ambiental."]
  - [F, "**Falso.** El decrecimiento propone reducir la producción y el consumo materiales en los países ricos, priorizando el bienestar, no empobrecerse."]
  - [V, "**Verdadero.** La EADS 2030 cuenta con 46 indicadores de seguimiento calculados por el IECA."]
  - [F, "**Falso.** En la controversia estructurada también hay que defender la postura contraria y buscar después una síntesis."]
sda04-s03:
  - [V, "**Verdadero.** Al especializarse, cada persona repite su tarea, gana destreza y ahorra tiempo."]
  - [F, "**Falso.** También incluyen bienes intangibles (marcas, patentes, programas informáticos) y derechos."]
  - [V, "**Verdadero.** La empresa adelanta el pago de salarios, materiales, etc., sin saber si venderá: asume el riesgo."]
  - [F, "**Falso.** La almazara transforma la aceituna en aceite: es **sector secundario** (industria). Quien cultiva el olivo está en el primario."]
  - [F, "**Falso.** Sin función comercial el producto no llega a quien lo necesita, por bueno que sea."]
  - [V, "**Verdadero.** Es la diferencia entre el valor de lo que vende y el de lo que compra a otras empresas."]
sda04-s04:
  - [F, "**Falso.** Objetivos como la satisfacción del cliente o la responsabilidad social son igual de importantes aunque no se midan con una cifra única."]
  - [V, "**Verdadero.** Los socios responden de las deudas solo hasta lo que aportaron, no con su patrimonio personal."]
  - [V, "**Verdadero.** Esa es la esencia de la cooperativa: socios que trabajan o usan sus servicios y deciden con una persona, un voto."]
  - [F, "**Falso.** Lo forman sobre todo micro y pequeñas empresas (pymes)."]
  - [V, "**Verdadero.** Es una de las formas de clasificar las empresas: según el alcance geográfico de su actividad."]
  - [F, "**Falso.** Hay que justificar el desacuerdo con argumentos y criterios, y proponer una alternativa."]
sda04-s05:
  - [F, "**Falso.** La tecnología es el conjunto de conocimientos y técnicas para producir; incluye la organización y los procesos, no solo las máquinas."]
  - [V, "**Verdadero.** Producto marginal: lo que aumenta la producción total al añadir una unidad más de trabajo."]
  - [F, "**Falso.** Con otros factores fijos, llega un momento en que cada trabajador añade menos: es la ley de rendimientos decrecientes."]
  - [V, "**Verdadero.** Esa es precisamente la definición de corto plazo."]
  - [F, "**Falso.** No es un periodo fijo: depende de cuánto tarde la empresa en poder cambiar todos sus factores."]
  - [V, "**Verdadero.** Al principio la especialización puede generar rendimientos crecientes, antes de que aparezcan los decrecientes."]
sda04-s06:
  - [F, "**Falso.** El alquiler se paga igual se produzca mucho o poco: es un coste **fijo**."]
  - [V, "**Verdadero.** Dependen de la cantidad producida: son un coste variable."]
  - [F, "**Falso.** Se multiplica por la cantidad **vendida**. Lo que se produce y no se vende no genera ingresos."]
  - [V, "**Verdadero.** Beneficio negativo = pérdida: los costes superan a los ingresos."]
  - [V, "**Verdadero.** Si el coste variable es por unidad, hay que multiplicarlo por la cantidad para obtener el coste variable total."]
  - [F, "**Falso.** También se puede vender más unidades o reducir los costes variables. Subir el precio es solo una de las opciones."]
sda04-s09:
  - [F, "**Falso.** No se exige precisión contable, sino coherencia entre las cifras y la idea de negocio, con los supuestos explicados."]
  - [F, "**Falso.** Puede ser perfectamente realista al empezar. Lo que hay que hacer es explicarlo."]
  - [V, "**Verdadero.** Si se usa como apoyo a la investigación o a la redacción, hay que indicarlo explícitamente."]
  - [V, "**Verdadero.** Es uno de los cuatro bloques obligatorios: problema, solución, cifras clave y compromiso social o medioambiental."]
  - [F, "**Falso.** Si vienen por unidad, hay que multiplicarlos por la cantidad estimada, como en la sesión 6."]
sda05-s02:
  - [F, "**Falso.** Es una explicación circular: no dice qué cambió en la oferta o en la demanda."]
  - [V, "**Verdadero.** La hipótesis se escribe antes de ver el resultado. Es lo que convierte la exploración en evidencia de razonamiento."]
  - [F, "**Falso.** No se evalúa acertar, sino el razonamiento: qué esperabas y por qué."]
  - [V, "**Verdadero.** El control del dispositivo cambia de manos en cada reto."]
  - [F, "**Falso.** Primero se explora con el simulador; la teoría llega en las sesiones siguientes y se apoya en esta experiencia."]
sda05-s05:
  - [F, "**Falso.** Por encima del equilibrio la cantidad ofrecida supera a la demandada: aparece un **excedente**, no una escasez."]
  - [F, "**Falso.** El precio de equilibrio surge del cruce entre la oferta y la demanda de todo el mercado."]
  - [V, "**Verdadero.** La curva de oferta se desplaza a la derecha: el precio de equilibrio baja y la cantidad aumenta."]
  - [F, "**Falso.** Esa es la demanda **elástica**. En la inelástica la cantidad reacciona poco al precio."]
  - [V, "**Verdadero.** Si la demanda apenas se reduce al subir el precio, una caída de la oferta dispara el precio."]
  - [F, "**Falso.** Construir vivienda lleva años: a corto plazo la oferta es muy **inelástica**."]
sda06-s02:
  - [V, "**Verdadero.** La primera empresa que lo denuncia y aporta pruebas puede quedar exenta de la multa."]
  - [V, "**Verdadero.** La Agencia de la Competencia y de la Regulación Económica de Andalucía actúa en el ámbito andaluz."]
  - [F, "**Falso.** Puede presentar una denuncia ante la CNMC o la autoridad autonómica, y reclamar a través de consumo."]
  - [V, "**Verdadero.** Es información obtenida directamente de quien trabaja en la institución: una fuente de primera mano."]
sda06-s05:
  - [F, "**Falso.** En el oligopolio las empresas son interdependientes: cada una debe tener en cuenta cómo reaccionarán las demás."]
  - [V, "**Verdadero.** Es el dilema del prisionero: a cada miembro le conviene saltarse el acuerdo si los demás lo cumplen."]
  - [F, "**Falso.** Es al revés: la primera que confiesa puede quedar exenta. Eso es lo que hace inestables los cárteles."]
  - [F, "**Falso.** Hay muchas empresas y las barreras de entrada son bajas; lo que las distingue es la diferenciación del producto."]
  - [V, "**Verdadero.** Al crear fidelidad a la marca, la clientela reacciona menos ante subidas de precio."]
  - [V, "**Verdadero.** Hay un solo comprador frente a muchos vendedores, y es el comprador quien tiene poder de mercado."]
sda07-s03:
  - [F, "**Falso.** Si no busca empleo, es población **inactiva**, aunque quiera trabajar."]
  - [V, "**Verdadero.** Si busca activamente trabajo y está disponible, es activo (parado), aunque estudie."]
  - [F, "**Falso.** Está **ocupado**. Es un caso de subempleo, pero no cuenta como parado."]
  - [F, "**Falso.** Se calcula sobre la **población activa**: parados / activos × 100."]
  - [V, "**Verdadero.** Las familias ofrecen trabajo y las empresas lo demandan."]
  - [V, "**Verdadero.** Por encima del equilibrio, más personas quieren trabajar de las que las empresas quieren contratar."]
sda07-s04:
  - [F, "**Falso.** Miden cosas distintas: la EPA es una encuesta con definiciones internacionales; el paro registrado cuenta a quien se inscribe en el SEPE."]
  - [V, "**Verdadero.** Al ser una encuesta a hogares, recoge la situación declarada, tenga o no contrato."]
  - [F, "**Falso.** Para comparar entre países se usa la EPA (y Eurostat), con definiciones armonizadas."]
  - [V, "**Verdadero.** Al ser un registro administrativo, ofrece datos por municipio."]
  - [F, "**Falso.** Para que sea verificable hay que indicar también la fecha, el periodo y el indicador exacto, y si es posible el enlace."]
  - [V, "**Verdadero.** Es el observatorio del Servicio Andaluz de Empleo."]
sda08-s01:
  - [F, "**Falso.** El PIB per cápita mide producción; el IDH combina renta, salud y educación."]
  - [V, "**Verdadero.** Si la renta no se traduce en salud y educación, el IDH queda por debajo de lo que haría esperar su PIB per cápita."]
  - [F, "**Falso.** El crecimiento puede concentrarse en unas zonas o en unos grupos. Una media no dice cómo se reparte."]
  - [V, "**Verdadero.** Ajusta por los precios de cada país para comparar lo que de verdad se puede comprar."]
  - [F, "**Falso.** No se contabiliza en el PIB, aunque tiene un gran valor económico. Es la crítica de Marilyn Waring."]
sda08-s02:
  - [F, "**Falso.** El crecimiento es aumento de la producción; el desarrollo incluye salud, educación, derechos y bienestar."]
  - [V, "**Verdadero.** Los indicadores sirven para diagnosticar dónde actuar y para evaluar los resultados."]
  - [F, "**Falso.** Incluso cuando funciona, unos agentes ganan más que otros. Siempre conviene preguntar quién gana y quién paga."]
  - [V, "**Verdadero.** Es el testimonio directo de alguien que trabaja en el terreno."]
sda09-s01:
  - [F, "**Falso.** Lo que uno gasta es ingreso para otro: la renta circula, no se destruye."]
  - [F, "**Falso.** Su gasto era la renta de otros agentes, que a su vez dejarán de gastar: el efecto se propaga."]
  - [V, "**Verdadero.** El ahorro es una filtración: renta que, de momento, no vuelve al circuito como gasto."]
  - [F, "**Falso.** Como no hay pago de por medio, no aparece en el flujo circular ni en el PIB, aunque tenga valor."]
  - [F, "**Falso.** En la SdA 8 aprendisteis quiénes son los agentes; la idea de **circuito** es lo nuevo de esta unidad."]
sda09-s02:
  - [V, "**Verdadero.** El Instituto de Estadística y Cartografía de Andalucía es el organismo estadístico oficial de la comunidad."]
  - [F, "**Falso.** Un dato sin fuente no se puede verificar: toda cifra debe indicar de dónde sale."]
  - [V, "**Verdadero.** Parte del gasto paga productos y beneficios de fuera de la provincia: son filtraciones del circuito local."]
  - [V, "**Verdadero.** Es información obtenida directamente de quien la produce o la vive."]
sda09-s07:
  - [V, "**Verdadero.** Consumo + inversión + gasto público + exportaciones netas."]
  - [F, "**Falso.** Un cambio en el nivel de precios es un **movimiento a lo largo** de la curva, no un desplazamiento."]
  - [V, "**Verdadero.** Abarata el crédito y estimula el consumo y la inversión."]
  - [F, "**Falso.** «Se prevé» indica una previsión, no un hecho ocurrido."]
  - [V, "**Verdadero.** Cuando sube el nivel de precios, la cantidad demandada agregada disminuye."]
  - [F, "**Falso.** Aumentan la renta disponible y el consumo, así que la demanda agregada aumenta."]
sda10-s02:
  - [V, "**Verdadero.** Capta el ahorro de unos y lo presta a otros."]
  - [V, "**Verdadero.** La Comisión Nacional del Mercado de Valores supervisa los mercados de valores."]
  - [V, "**Verdadero.** Es información de primera mano de quien trabaja en el sector."]
  - [F, "**Falso.** Están obligados a evaluar el perfil (conocimientos, riesgo, necesidades) de cada cliente."]
sda10-s08:
  - [F, "**Falso.** Blockchain es la tecnología de registro; las criptomonedas son solo una de sus aplicaciones."]
  - [F, "**Falso.** Tu banco nunca te pedirá claves por SMS ni por enlace. Es *phishing* (*smishing*)."]
  - [V, "**Verdadero.** Se puede consultar en los registros de la CNMV y del Banco de España."]
  - [F, "**Falso.** El rendimiento sale del dinero de quienes entran después, no de una actividad real."]
  - [V, "**Verdadero.** Es la lógica del seguro: transformar un riesgo grande e incierto en un coste pequeño y cierto."]
  - [F, "**Falso.** Es la frase típica de las burbujas. Que algo suba mucho no garantiza que siga subiendo."]
sda11-s02:
  - [V, "**Verdadero.** El Eurosistema lo forman el BCE y los bancos centrales nacionales de la zona euro."]
  - [F, "**Falso.** Depende de en qué gasta cada familia: afecta más a quien dedica más renta a alimentos, energía o vivienda."]
  - [V, "**Verdadero.** Es información de primera mano de quien trabaja en el ámbito."]
sda11-s04:
  - [F, "**Falso.** Eso es inflación de **demanda**. La de costes aparece cuando suben los costes de producción (energía, materias primas, salarios)."]
  - [V, "**Verdadero.** Si se espera inflación, se suben precios y salarios por adelantado y la inflación se confirma."]
  - [F, "**Falso.** Puede retrasar el consumo y la inversión, frenar la economía y aumentar el paro."]
  - [V, "**Verdadero.** Es la tesis monetarista que defendió junto a Milton Friedman."]
  - [F, "**Falso.** El objetivo del BCE es una inflación del **2 %** a medio plazo."]
  - [F, "**Falso.** Con deflación las deudas pesan **más** en términos reales: se devuelven con un dinero que vale más."]
sda12-s03:
  - [F, "**Falso.** El IVA es un impuesto **indirecto**: grava el consumo, no la renta ni el patrimonio."]
  - [V, "**Verdadero.** El porcentaje que se paga aumenta al aumentar la renta."]
  - [F, "**Falso.** El tipo más alto solo se aplica a la parte de la renta que supera el umbral del tramo: el neto siempre aumenta."]
  - [V, "**Verdadero.** Además de recaudar, busca reducir un consumo perjudicial."]
  - [F, "**Falso.** En un impuesto progresivo el tipo efectivo (la media) es menor o igual que el marginal (el del último euro)."]
  - [V, "**Verdadero.** Se aplica un mismo porcentaje sobre el beneficio, sea cual sea su tamaño."]
sda12-s06:
  - [F, "**Falso.** Actúan solos: en una crisis se recauda menos y se paga más en prestaciones sin necesidad de decidir nada."]
  - [V, "**Verdadero.** Multiplicador = 1 / (1 − 0,8) = 1 / 0,2 = 5."]
  - [F, "**Falso.** Cuanto mayor es la propensión marginal al consumo, **mayor** es el multiplicador."]
  - [V, "**Verdadero.** Hay impuestos, ahorro e importaciones que filtran parte del gasto en cada ronda."]
  - [F, "**Falso.** Eso es una política contractiva. La expansiva baja impuestos o aumenta el gasto."]
  - [V, "**Verdadero.** Cada ronda de gasto es una fracción de la anterior: la suma converge a 1 / (1 − PMC)."]
