rubricas:
- criterio: '1.1'
  descripcion: Comprender la realidad económica española y andaluza actual, analizando la repercusión de las decisiones adoptadas en el ámbito económico, valorando los procesos de integración económica y estableciendo comparaciones sobre las soluciones alternativas que ofrecen los distintos sistemas.
  competencia: '1'
  saberes: A1/A2/A3/C4/D1
  descriptores: CCL2/CP3/STEM2/CPSAA4/CPSAA5/CE1/CE2
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: 'No comprende los procesos de integración económica (comercio internacional, Unión Europea) ni los relaciona con la realidad andaluza: ni lo explica en el debate sobre proteccionismo ni lo refleja en sus producciones escritas (cuestionario, prueba escrita).'
  - nivel: Suficiente
    notas: '5'
    descriptor: Describe de forma muy elemental algún proceso de integración económica (p. ej., qué es la Unión Europea) y menciona algún dato del comercio exterior andaluz de forma guiada, ya sea en el cuestionario, en el portafolio o cuando se le pregunta directamente.
  - nivel: Bien
    notas: '6'
    descriptor: Explica con corrección la ventaja comparativa, el debate librecambio-proteccionismo y el papel básico de la Unión Europea, relacionándolos con algún dato real de la economía andaluza; lo demuestra tanto en la prueba escrita como en su participación oral durante el debate.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza con solidez los procesos de integración económica y compara de forma justificada distintas soluciones (librecambio/proteccionismo, distintos bloques de integración), aplicándolos a casos reales de la economía andaluza; lo argumenta tanto oralmente —en el debate y en la propuesta de la campaña— como por escrito —en la prueba escrita y el portafolio.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: 'Evalúa con profundidad y espíritu crítico la realidad económica española y andaluza actual, estableciendo comparaciones argumentadas y originales entre modelos y procesos de integración, y lo sostiene de manera consistente en todos los instrumentos aplicados: debate, prueba escrita, portafolio, podcast/infografía de la campaña y coevaluación entre iguales.'
- criterio: '5.1'
  descripcion: Proponer iniciativas que fomenten la equidad, la justicia y la sostenibilidad a partir de la identificación de los retos y desafíos que plantea la economía actual, valorando sus ventajas e inconvenientes y analizando, con sentido crítico, el impacto que provoca la globalización, la nueva economía y la revolución digital en el bienestar económico y social de los ciudadanos.
  competencia: '5'
  saberes: E1/E2/E3/E4/E5
  descriptores: CCL2/CCL3/STEM4/CD5/CPSAA1.2/CPSAA4/CPSAA5/CE1
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: No logra formular ninguna iniciativa razonada ante los retos de la globalización o la revolución digital, ni en el podcast o la infografía de la campaña ni en sus producciones escritas (prueba escrita, portafolio).
  - nivel: Suficiente
    notas: '5'
    descriptor: Propone una iniciativa muy genérica o poco fundamentada ante un reto económico actual, ya sea en la propuesta ODS de la campaña, en el cuestionario o cuando se le pregunta de forma guiada.
  - nivel: Bien
    notas: '6'
    descriptor: Propone una iniciativa correctamente vinculada a un ODS y a un reto real (globalización, economía digital o desigualdad), con una justificación básica de su viabilidad; lo demuestra tanto en el podcast o la infografía de la campaña como en la prueba escrita.
  - nivel: Notable
    notas: 7-8
    descriptor: Diseña una iniciativa bien fundamentada y viable que equilibra equidad, justicia y sostenibilidad, valorando ventajas e inconvenientes de forma crítica; lo argumenta con solidez tanto oralmente —en el podcast y el turno de preguntas de la Gala de lanzamiento— como por escrito —en la propuesta ODS y la prueba escrita.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: Formula una iniciativa original, rigurosa y bien argumentada, conectando con precisión los retos de la globalización, la revolución digital y la sostenibilidad con una propuesta viable de aplicación local; lo sostiene de manera consistente en el podcast, la infografía, la propuesta ODS, la prueba escrita y la coevaluación de sus compañeros/as.
- criterio: '5.2'
  descripcion: Comprender los retos económicos actuales analizando, de forma crítica y constructiva, el entorno, identificando aquellos elementos que condicionan y transforman la economía y fomentando iniciativas que respondan a las necesidades que plantean estos retos.
  competencia: '5'
  saberes: E1/E2/E3/E4/E5
  descriptores: CCL2/CCL3/STEM4/CD5/CPSAA1.2/CPSAA4/CPSAA5/CE1
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: Muestra errores graves al explicar los elementos que transforman la economía actual (globalización, digitalización, Estado del bienestar, decrecimiento), tanto en sus respuestas escritas como en su participación oral y en el trabajo de equipo observado por el docente.
  - nivel: Suficiente
    notas: '5'
    descriptor: Describe de forma básica o guiada algún reto económico actual y alguna medida asociada, ya sea en el portafolio, en el cuestionario o cuando se le pregunta directamente en clase.
  - nivel: Bien
    notas: '6'
    descriptor: Explica con corrección los principales retos económicos actuales (globalización, revolución digital, Estado del bienestar, decrecimiento y ODS) y su interconexión básica, tanto en la prueba escrita como en sus intervenciones orales durante el debate.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza con detalle los elementos que condicionan y transforman la economía actual, argumentando con claridad y coherencia sus causas y consecuencias; lo sostiene tanto de forma oral —en los debates de S9 y S10 y en el turno de preguntas de la Gala de lanzamiento— como por escrito —en la prueba escrita y la propuesta ODS.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: Evalúa con alto sentido crítico y constructivo los retos de la economía actual, conectando causas y efectos económicos, sociales y ambientales de forma autónoma y original, y lo demuestra de manera consistente en la exposición oral, el debate, la prueba escrita, el portafolio y su propia autoevaluación.
