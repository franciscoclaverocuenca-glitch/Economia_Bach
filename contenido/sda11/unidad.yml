n: 11
carpeta: sda11
titulo: ¿Por qué suben los precios?
titulo_largo: SdA 11 · ¿Por qué suben los precios? · Economía 1.º Bachillerato
descripcion: 'Situación de aprendizaje 11: inflación y política monetaria. Economía, 1.º de Bachillerato (Humanidades y Ciencias Sociales). IES · Málaga · Curso 2027-2028.'
