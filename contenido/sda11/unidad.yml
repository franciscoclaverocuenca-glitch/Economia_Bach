temas: inflación ipc deflación política monetaria bce tipos de interés euríbor poder adquisitivo cesta de la compra precios eurozona
rubricas:
- criterio: '4.1'
  descripcion: Conocer y comprender el funcionamiento del sistema financiero y de las políticas monetarias, valorando sus efectos sobre la economía real y analizando los elementos que intervienen en las decisiones financieras relacionadas con la inversión, el ahorro, los productos financieros y la búsqueda de fuentes de financiación, para planificar y gestionar con mayor responsabilidad y autonomía las propias finanzas y adoptar decisiones financieras fundamentadas.
  competencia: '4'
  saberes: A4/C5/D3
  descriptores: CCL2/CCL3/STEM1/STEM4/CD4/CPSAA1.2/CPSAA4/CPSAA5/CE1/CE2
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: No comprende qué es la inflación ni cómo actúa la política monetaria del BCE, ni lo explica en sus intervenciones orales (debate, comparecencia) ni lo refleja en sus producciones escritas (prueba escrita, portafolio, comunicado).
  - nivel: Suficiente
    notas: '5'
    descriptor: Define la inflación y menciona de forma muy elemental que el BCE “sube o baja los tipos”, ya sea al responder al cuestionario, en sus anotaciones del portafolio o cuando se le pregunta oralmente de forma guiada.
  - nivel: Bien
    notas: '6'
    descriptor: Explica correctamente qué es la inflación, cómo se mide con el IPC y qué instrumentos básicos usa el BCE, sin profundizar en el mecanismo; lo demuestra con corrección tanto en la prueba escrita como en su participación durante el trabajo cooperativo observado por el docente.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza justificadamente las causas y consecuencias de la inflación y el efecto de la política monetaria sobre la economía real; lo argumenta con solidez tanto de forma oral (en el debate “¿precios o empleo?” y en la rueda de prensa) como por escrito, en la prueba escrita y el comunicado del BCE.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: 'Argumenta y evalúa con profundidad el fenómeno inflacionario y el mecanismo de transmisión de la política monetaria, conectando causas y efectos de forma autónoma y consistente en todos los instrumentos aplicados: comparecencia y debate oral, prueba escrita, portafolio, comunicado del BCE y coevaluación entre iguales.'
- criterio: '4.2'
  descripcion: Planificar y gestionar con responsabilidad y progresiva autonomía las finanzas personales y adoptar decisiones fundamentadas a partir del conocimiento y comprensión del sistema financiero, valorando los elementos que intervienen en las decisiones financieras y los efectos que estos pueden provocar en la economía real.
  competencia: '4'
  saberes: A4/C5/D3
  descriptores: CCL2/CCL3/STEM1/STEM4/CD4/CPSAA1.2/CPSAA4/CPSAA5/CE1/CE2
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: No relaciona la inflación ni los tipos de interés con las decisiones financieras cotidianas (ahorrar, gastar, endeudarse), ni por escrito (prueba, portafolio) ni en su participación oral y en el trabajo de equipo observado por el docente.
  - nivel: Suficiente
    notas: '5'
    descriptor: Reconoce de forma básica o guiada que la inflación “hace que el dinero valga menos” y que conviene tenerlo en cuenta al ahorrar, ya sea en el portafolio, en el cuestionario o cuando se le pregunta directamente en clase.
  - nivel: Bien
    notas: '6'
    descriptor: Explica con corrección cómo la inflación erosiona el poder adquisitivo y distingue el interés nominal del real en un caso sencillo, aplicándolo a una decisión financiera personal, tanto en la prueba escrita como en sus intervenciones durante el trabajo cooperativo.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza con detalle el efecto de una subida o bajada de tipos sobre decisiones financieras concretas (una hipoteca, un ahorro, un crédito) y lo argumenta con claridad; lo sostiene de forma oral (al responder en la rueda de prensa sobre el impacto en las familias) y por escrito, en el comunicado y la prueba escrita.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: Evalúa con alto sentido crítico y autonomía cómo la política monetaria y la inflación condicionan las finanzas personales, integrando el interés real y el impacto distributivo, y lo demuestra de manera consistente en la comparecencia oral, el debate, la prueba escrita, el portafolio y su propia autoevaluación.
- criterio: '4.3'
  descripcion: Adquirir conocimientos financieros a partir del análisis del sistema financiero, su funcionamiento y los efectos que se derivan de las decisiones adoptadas en él y estableciendo conexiones entre estos aprendizajes y sus decisiones financieras personales que afectan a su vida cotidiana y comprendiendo la influencia de las decisiones financieras en la viabilidad de los proyectos personales, de las empresas y del sector público.
  competencia: '4'
  saberes: A4/C5/D3
  descriptores: CCL2/CCL3/STEM1/STEM4/CD4/CPSAA1.2/CPSAA4/CPSAA5/CE1/CE2
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: Muestra errores graves al conectar las decisiones de política monetaria con su impacto sobre las familias, las empresas y el sector público, tanto en sus respuestas escritas (cuestionario, prueba escrita, comunicado) como en su participación oral y en el trabajo de equipo.
  - nivel: Suficiente
    notas: '5'
    descriptor: Describe de forma básica o guiada que las decisiones del BCE “afectan a todos”, ya sea en el portafolio, en el cuestionario o cuando se le pregunta directamente, sin distinguir bien a los distintos agentes.
  - nivel: Bien
    notas: '6'
    descriptor: Explica con corrección cómo una decisión de tipos afecta al menos a dos agentes (por ejemplo, familias hipotecadas y empresas que buscan financiación), tanto en la prueba escrita como en sus intervenciones orales durante el debate y la comparecencia.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza con detalle y coherencia las conexiones entre la política monetaria y las decisiones de familias, empresas y sector público (coste de la deuda pública, viabilidad de proyectos), y lo defiende ante las réplicas de la “prensa” en la rueda de prensa y por escrito en el comunicado y la prueba.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: Evalúa de forma autónoma y con visión de conjunto el impacto sistémico de la política monetaria sobre los distintos agentes económicos, conectando causas y efectos complejos, y lo demuestra de manera consistente en la exposición oral, el debate, la prueba escrita, el comunicado del BCE y su autoevaluación.
