rubricas:
- criterio: '5.1'
  descripcion: Proponer iniciativas que fomenten la equidad, la justicia y la sostenibilidad a partir de la identificación de los retos y desafíos que plantea la economía actual, valorando sus ventajas e inconvenientes y analizando, con sentido crítico, el impacto que provoca la globalización, la nueva economía y la revolución digital en el bienestar económico y social de los ciudadanos.
  competencia: '5'
  saberes: E1/E2/E3/E4/E5
  descriptores: CCL2/CCL3/STEM4/CD5/CPSAA1.2/CPSAA4/CPSAA5/CE1
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: 'No identifica los retos de la economía actual ni propone iniciativas coherentes: ni las formula en sus intervenciones orales (debate, defensa del Dictamen) ni las refleja en sus producciones escritas (Dictamen, portafolio, prueba escrita).'
  - nivel: Suficiente
    notas: '5'
    descriptor: Nombra algún reto de la economía actual y propone una iniciativa muy elemental de mejora de la equidad o la sostenibilidad, de forma guiada, ya sea en el cuestionario, en el portafolio o cuando se le pregunta oralmente.
  - nivel: Bien
    notas: '6'
    descriptor: Identifica correctamente los principales retos y propone iniciativas básicas y razonables sin profundizar en sus ventajas e inconvenientes; lo demuestra tanto en el Dictamen como en su participación oral observada por el docente.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza justificadamente el impacto de la globalización, la nueva economía y la digitalización, y propone iniciativas fundamentadas valorando críticamente sus pros y sus contras, tanto de forma oral —en el debate y en la defensa ante la Comisión— como por escrito —en el Dictamen y el portafolio—.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: 'Evalúa con profundidad y sentido crítico los retos de la economía actual y propone iniciativas innovadoras y viables orientadas a la equidad, la justicia y la sostenibilidad, de forma consistente en todos los instrumentos aplicados: exposición y debate oral, Dictamen, portafolio, prueba escrita y coevaluación entre iguales.'
- criterio: '5.2'
  descripcion: Comprender los retos económicos actuales analizando, de forma crítica y constructiva, el entorno, identificando aquellos elementos que condicionan y transforman la economía y fomentando iniciativas que respondan a las necesidades que plantean estos retos.
  competencia: '5'
  saberes: E1/E2/E3/E4/E5
  descriptores: CCL2/CCL3/STEM4/CD5/CPSAA1.2/CPSAA4/CPSAA5/CE1
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: Muestra errores graves al explicar los retos económicos actuales y los factores que transforman la economía, tanto en sus respuestas escritas como en su participación oral y en el trabajo de equipo observado por el docente.
  - nivel: Suficiente
    notas: '5'
    descriptor: Describe de forma básica o guiada algún reto económico actual y algún factor que lo condiciona, ya sea en el portafolio, en el cuestionario o cuando se le pregunta directamente en clase.
  - nivel: Bien
    notas: '6'
    descriptor: Explica con corrección los principales retos y reconoce los elementos que condicionan y transforman la economía, tanto en la prueba escrita como en sus intervenciones orales durante el debate y el trabajo de la Comisión.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza con detalle y sentido crítico el entorno económico, conectando los retos entre sí y con sus causas, y lo sostiene tanto de forma oral —en el debate y en la Comisión— como por escrito —en el Dictamen y la prueba escrita—, defendiendo su análisis ante las réplicas.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: Evalúa con alto sentido crítico y constructivo los retos económicos y su transformación, integrando causas y efectos complejos de forma autónoma, y lo demuestra de manera consistente en la exposición oral, el debate, el Dictamen, el portafolio y su propia autoevaluación.
- criterio: '6.1'
  descripcion: Plantear soluciones socioeconómicas que respondan a necesidades individuales y colectivas, investigando y explorando la realidad económica, teniendo en cuenta diversos factores y aplicando las herramientas propias del ámbito de la economía.
  competencia: '6'
  saberes: A5/A6/D2
  descriptores: CCL3/STEM2/CPSAA5/CC3/CC4/CE1/CE2/CE3/CCEC2
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: No plantea soluciones socioeconómicas coherentes ni aplica herramientas del análisis económico, tanto en sus producciones escritas (Dictamen, prueba escrita) como en su participación oral y en el trabajo cooperativo observado por el docente.
  - nivel: Suficiente
    notas: '5'
    descriptor: Propone una solución muy elemental a un problema económico y menciona alguna herramienta de análisis de forma guiada, ya sea en el portafolio, en el cuestionario o cuando se le pregunta oralmente.
  - nivel: Bien
    notas: '6'
    descriptor: Plantea soluciones básicas y razonables investigando la realidad económica y aplicando alguna herramienta propia de la economía (clasificación fiscal, esquema déficit/deuda), tanto en el Dictamen como en su participación oral observada.
  - nivel: Notable
    notas: 7-8
    descriptor: Plantea soluciones socioeconómicas fundamentadas teniendo en cuenta diversos factores (equidad, eficiencia, sostenibilidad, viabilidad) y aplicando con solvencia las herramientas del análisis económico, tanto de forma oral —en la defensa del Dictamen— como por escrito —en el Dictamen y la prueba escrita—.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: Diseña soluciones socioeconómicas innovadoras, viables y bien fundamentadas, integrando de forma autónoma múltiples factores y herramientas del análisis económico, y lo demuestra de manera consistente en el Dictamen, la exposición oral, el debate, el portafolio y la coevaluación.
- criterio: '6.2'
  descripcion: Comprender y valorar la importancia del análisis de los datos, la aplicación de modelos económicos y el estudio de la viabilidad de soluciones fundamentadas al proponer medidas para mejorar el bienestar individual y social.
  competencia: '6'
  saberes: A5/A6/D2
  descriptores: CCL3/STEM2/CPSAA5/CC3/CC4/CE1/CE2/CE3/CCEC2
  niveles:
  - nivel: Insuficiente
    notas: 1-4
    descriptor: 'No maneja datos económicos ni aplica modelos, y no valora la viabilidad de las medidas que propone: ni en sus respuestas escritas (prueba escrita, Dictamen) ni en su participación oral y en el trabajo de equipo observado.'
  - nivel: Suficiente
    notas: '5'
    descriptor: Lee un dato económico sencillo o aplica un modelo muy elemental (por ejemplo, un multiplicador dado) de forma guiada, y apunta si una medida es o no viable, ya sea en el portafolio, el cuestionario o de forma oral.
  - nivel: Bien
    notas: '6'
    descriptor: Interpreta correctamente datos económicos básicos y aplica modelos sencillos (multiplicador, progresividad), valorando la viabilidad general de una medida, tanto en la prueba escrita como en sus intervenciones orales.
  - nivel: Notable
    notas: 7-8
    descriptor: Analiza datos económicos con rigor, aplica modelos con corrección y estudia con solidez la viabilidad de las soluciones, argumentándolo tanto de forma oral —en la Comisión— como por escrito —en el Dictamen y la prueba escrita—, y defiende sus estimaciones ante las réplicas del debate.
  - nivel: Sobresaliente
    notas: 9-10
    descriptor: Evalúa con alto sentido crítico la calidad y los límites de los datos y de los modelos, y fundamenta con solvencia la viabilidad de sus propuestas, demostrándolo de manera consistente en el Dictamen, la exposición oral, el debate, la prueba escrita y su propia autoevaluación.
